[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    error::DeprecationWarning
    always:^Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.$:DeprecationWarning:fastapi\.testclient$
    always:^The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.$:DeprecationWarning:starlette\.testclient$
markers =
    integration: requires isolated PostgreSQL + pgvector and Redis test services
    native_postgres: requires separate native PostgreSQL backend processes
