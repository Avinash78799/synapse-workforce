# Production Docker Compose Override for AI Workforce Platform
name: agent-workforce-prod

services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECURE_COOKIES: "true"
      WORKSPACE_SIGNUP_ENABLED: "false"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  oauth-worker:
    restart: unless-stopped
    environment:
      APP_ENV: production

  web:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  proxy:
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./.secrets/certs:/etc/ssl/certs:ro
      - certbot_www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  certbot_www:
